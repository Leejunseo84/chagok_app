<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>차곡 - 우리 둘의 가계부</title>
<meta name="theme-color" content="#7a4a2b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="차곡" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ 온보딩: 캐릭터 선택 ============ -->
<section id="screen-onboarding" class="screen">
  <div class="onb-wrap">
    <h1 class="game-title">차곡<span class="game-title-sub">우리 둘의 가계부</span></h1>

    <div class="onb-step" id="onb-step-me">
      <p class="onb-label">내 캐릭터를 골라줘</p>
      <div class="avatar-grid" id="avatar-grid-me"></div>
      <input type="text" id="input-name-me" class="pixel-input" placeholder="이름 (예: 준서)" maxlength="6" />
      <button class="pixel-btn" id="btn-onb-next">다음 →</button>
    </div>

    <div class="onb-step hidden" id="onb-step-partner">
      <p class="onb-label">상대방 캐릭터도 골라줘</p>
      <div class="avatar-grid" id="avatar-grid-partner"></div>
      <input type="text" id="input-name-partner" class="pixel-input" placeholder="이름 (예: 여자친구)" maxlength="6" />
      <button class="pixel-btn" id="btn-onb-start">시작하기 🏡</button>
    </div>
  </div>
</section>

<!-- ============ 메인: 마을 화면 ============ -->
<section id="screen-town" class="screen hidden">

  <header class="topbar">
    <button class="icon-btn" id="btn-open-history" title="통계">📊</button>
    <div class="wallet-chip" id="wallet-chip">
      <canvas id="wallet-canvas" width="28" height="28"></canvas>
      <span id="wallet-amount">0원</span>
    </div>
    <button class="icon-btn" id="btn-open-settings" title="설정">⚙️</button>
  </header>

  <div class="town-stage" id="town-stage">
    <div class="town-ground" id="town-ground"></div>
    <div class="buildings-layer" id="buildings-layer"></div>
    <div class="char-layer" id="char-layer"></div>
    <div class="fx-layer" id="fx-layer"></div>
  </div>

  <footer class="action-bar">
    <button class="action-btn income" data-action="income">
      <span class="action-icon">💰</span><span>수입</span>
    </button>
    <button class="action-btn expense" data-action="expense">
      <span class="action-icon">🧾</span><span>지출</span>
    </button>
    <button class="action-btn saving" data-action="saving">
      <span class="action-icon">🏦</span><span>적금</span>
    </button>
  </footer>
</section>

<!-- ============ 입력 모달 ============ -->
<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal-sheet" id="modal-sheet">
    <div class="modal-head">
      <span id="modal-title">지출 추가</span>
      <button class="icon-btn" id="btn-modal-close">✕</button>
    </div>

    <div class="modal-body">
      <label class="field-label" id="who-field-label">누가 썼어?</label>
      <div class="who-row" id="who-row"></div>

      <div id="category-field" class="hidden">
        <label class="field-label">어디에 썼어?</label>
        <div class="category-row" id="category-row"></div>
      </div>

      <label class="field-label">금액</label>
      <input type="number" inputmode="numeric" id="input-amount" class="pixel-input" placeholder="0" />

      <label class="field-label">날짜</label>
      <input type="date" id="input-date" class="pixel-input" />

      <label class="field-label">메모 (선택)</label>
      <input type="text" id="input-memo" class="pixel-input" placeholder="예: 점심 김밥" maxlength="30" />

      <button class="pixel-btn confirm" id="btn-confirm-add">넣기!</button>
    </div>
  </div>
</div>

<!-- ============ 통계/히스토리 화면 ============ -->
<section id="screen-history" class="screen hidden">
  <header class="subbar">
    <button class="icon-btn" id="btn-history-back">←</button>
    <span class="subbar-title">이번 달 기록</span>
    <span class="subbar-spacer"></span>
  </header>

  <div class="history-content">
    <div class="stat-card" id="stat-summary"></div>
    <div class="stat-card">
      <div class="stat-card-title">카테고리별 지출</div>
      <div id="category-bars"></div>
    </div>
    <div class="stat-card">
      <div class="stat-card-title">적금 현황</div>
      <div id="saving-progress"></div>
    </div>
    <div class="stat-card">
      <div class="stat-card-title">최근 내역</div>
      <div id="tx-list"></div>
    </div>
  </div>
</section>

<!-- ============ 설정 화면 ============ -->
<section id="screen-settings" class="screen hidden">
  <header class="subbar">
    <button class="icon-btn" id="btn-settings-back">←</button>
    <span class="subbar-title">설정</span>
    <span class="subbar-spacer"></span>
  </header>

  <div class="history-content">
    <div class="stat-card">
      <div class="stat-card-title">적금 목표 금액</div>
      <input type="number" inputmode="numeric" id="input-goal" class="pixel-input" placeholder="예: 3000000" />
      <button class="pixel-btn" id="btn-save-goal">목표 저장</button>
    </div>

    <div class="stat-card">
      <div class="stat-card-title">데이터 공유 (수동)</div>
      <p class="hint-text">둘이 각자 폰에 이 앱을 쓰다가, 아래 "내보내기"로 파일을 만들어 카톡 등으로 보내주면 상대방이 "불러오기"로 합칠 수 있어요. 이미 있는 기록은 중복으로 추가되지 않아요.</p>
      <button class="pixel-btn" id="btn-export">📤 내보내기 (파일 저장)</button>
      <label class="pixel-btn" id="btn-import-label" for="input-import">📥 불러오기 (파일 선택)</label>
      <input type="file" id="input-import" accept="application/json" class="hidden" />
      <div id="import-result" class="hint-text"></div>
    </div>

    <div class="stat-card">
      <div class="stat-card-title">위험 구역</div>
      <button class="pixel-btn danger" id="btn-reset">전체 초기화</button>
    </div>
  </div>
</section>

<div id="toast" class="toast hidden"></div>

<script src="pixelart.js"></script>
<script src="app.js"></script>
</body>
</html>
